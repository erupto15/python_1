# Blueprint для Render: постоянная БД через Supabase или Render Postgres.
# https://render.com/docs/blueprint-spec
#
# После создания сервиса обязательно задайте в Dashboard → Environment:
#   DATABASE_URL  — строка PostgreSQL (Supabase pooler :6543 или Render Postgres)
#   JWT_SECRET    — openssl rand -hex 32
#   TELEGRAM_BOT_TOKEN
#   APP_ENV=production

services:
  - type: web
    name: climbing-guidebook-api
    runtime: python
    rootDir: climbing-guidebook/backend
    buildCommand: pip install -r requirements.txt
    startCommand: python bootstrap_database.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.12"
      - key: POSTGRES_HOST
        value: dpg-d7tfijbrjlhs73ar905g-a
      - key: POSTGRES_PORT
        value: "5432"
      - key: POSTGRES_USER
        value: user_optional
      - key: POSTGRES_DB
        value: guidebook
      - key: POSTGRES_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_EMAIL
        value: admin@climbing-guidebook.local
      - key: ADMIN_PASSWORD
        sync: false
      - key: TELEGRAM_AUTH_MAX_AGE_SEC
        value: "86400"
