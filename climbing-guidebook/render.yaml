# Blueprint для Render: постоянная БД через Supabase или Render Postgres.
# https://render.com/docs/blueprint-spec
#
# После создания сервиса задайте в Dashboard → Environment (sync: false ниже):
#   DATABASE_URL или POSTGRES_* + POSTGRES_PASSWORD — из панели PostgreSQL
#   JWT_SECRET    — openssl rand -hex 32
#   TELEGRAM_BOT_TOKEN
#   ADMIN_PASSWORD
#   APP_ENV=production

services:
  - type: web
    name: climbing-guidebook-api
    runtime: python
    rootDir: climbing-guidebook/backend
    buildCommand: pip install -r requirements.txt
    startCommand: python bootstrap_database.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.12"
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_PORT
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_DB
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_EMAIL
        value: admin@climbing-guidebook.local
      - key: ADMIN_PASSWORD
        sync: false
      - key: TELEGRAM_AUTH_MAX_AGE_SEC
        value: "86400"
