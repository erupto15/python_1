<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6А9А — офлайн</title>
    <style>
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: #0f1419; color: #f5f5f7; font: 16px/1.5 system-ui, sans-serif; padding: 24px;
            text-align: center;
        }
        .card { max-width: 360px; }
        h1 { font-size: 1.25rem; margin: 0 0 12px; }
        p { color: #a8b0bd; margin: 0 0 20px; }
        button {
            background: #e8472a; color: #fff; border: none; border-radius: 10px;
            padding: 12px 20px; font-size: 16px; font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Нет сети</h1>
        <p>Для первого запуска нужен интернет. Если вы уже открывали приложение онлайн, включите сеть и нажмите «Повторить» — подтянется сохранённая оболочка и каталог.</p>
        <button type="button" id="retryBtn">Повторить</button>
    </div>
    <script>
        document.getElementById('retryBtn').addEventListener('click', function () {
            var base = 'https://92.246.76.142.sslip.io/?app=android&retry=' + Date.now();
            location.href = base;
        });
    </script>
</body>
</html>
