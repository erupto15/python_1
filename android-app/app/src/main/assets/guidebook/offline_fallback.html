<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6А9А — офлайн</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: system-ui, -apple-system, sans-serif;
            background: #0f1419;
            color: #f5f5f7;
            text-align: center;
        }
        .card { max-width: 360px; }
        h1 { font-size: 1.25rem; margin: 0 0 12px; }
        p { margin: 0 0 16px; line-height: 1.45; color: #a8b0bd; font-size: 15px; }
        button {
            border: 0;
            border-radius: 12px;
            padding: 12px 18px;
            font-size: 16px;
            font-weight: 600;
            background: #e8472a;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Нет связи с гайдом</h1>
        <p>Проверьте интернет и вернитесь в приложение. Каталог из кэша откроется после перезапуска, если вы уже заходили онлайн.</p>
        <button type="button" onclick="tryReload()">Повторить</button>
    </div>
    <script>
        function tryReload() {
            if (window.history.length > 1) {
                window.history.back();
                return;
            }
            location.href = '/?app=android';
        }
    </script>
</body>
</html>
