plugins {
    id 'com.android.application'
}

android {
    namespace 'io.sixa9a.guide'
    compileSdk 34

    defaultConfig {
        applicationId 'io.sixa9a.guide'
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName '1.0.4'
        buildConfigField 'String', 'GUIDE_URL', '"https://92.246.76.142.sslip.io/"'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
