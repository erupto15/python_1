plugins {
    id 'com.android.application'
}

android {
    namespace 'io.sixa9a.guide'
    compileSdk 34

    defaultConfig {
        applicationId 'io.sixa9a.guide'
        minSdk 24
        targetSdk 34
        versionCode 21
        versionName '1.0.20'
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        buildConfigField 'String', 'GUIDE_URL', '"https://92.246.76.142.sslip.io/"'
        // Для магазинов (RuStore/Google Play) собирать с -PselfUpdate=false: обновляет магазин.
        buildConfigField 'boolean', 'SELF_UPDATE_ENABLED', (project.findProperty('selfUpdate') ?: 'true').toString() == 'false' ? 'false' : 'true'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
