plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'vkid.manifest.placeholders'
}

def vkProps = new Properties()
def vkLocal = rootProject.file('local.properties')
if (vkLocal.exists()) {
    vkLocal.withInputStream { vkProps.load(it) }
}
def vkClientId = (vkProps.getProperty('VKIDClientID') ?: '0').trim()
def vkIdEnabled = vkClientId != '' && vkClientId != '0'

android {
    namespace 'io.sixa9a.guide'
    compileSdk 34

    defaultConfig {
        applicationId 'io.sixa9a.guide'
        minSdk 24
        targetSdk 34
        versionCode 19
        versionName '1.0.18'
        buildConfigField 'String', 'GUIDE_URL', '"https://92.246.76.142.sslip.io/"'
        buildConfigField 'boolean', 'VKID_ENABLED', vkIdEnabled ? 'true' : 'false'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'com.vk.id:vkid:2.7.3'
}
