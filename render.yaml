# Render Blueprint — API + PostgreSQL
# Обязательно в Dashboard → Environment: POSTGRES_* / DATABASE_URL, POSTGRES_PASSWORD, JWT_SECRET, TELEGRAM_BOT_TOKEN, ADMIN_PASSWORD
# Root Directory сервиса: climbing-guidebook/backend

services:
  - type: web
    name: climbing-guidebook-api
    runtime: python
    branch: main
    rootDir: climbing-guidebook/backend
    buildCommand: pip install -r requirements.txt
    startCommand: python bootstrap_database.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.12"
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_PORT
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_DB
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@climbing-guidebook.local
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_DISPLAY_NAME
        value: Administrator
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_AUTH_MAX_AGE_SEC
        value: "86400"
